name: Sync Green DiSC criteria

# Regenerates criteria.yml from upstream and opens a pull request if it changed.
# Runs on demand, whenever config.yml changes, and at the start of each review
# (called from review.yml, which gets the pull request's number, if any).
on:
  workflow_dispatch:
  workflow_call:
    outputs:
      pr:
        description: Number of the open sync pull request, if criteria changed
        value: ${{ jobs.sync.outputs.pr }}
  push:
    branches: [main]
    paths: [config.yml]

permissions: {}

jobs:
  sync:
    # Only in repositories created from the template, not in the template itself.
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the sync branch
      pull-requests: write # open the pull request
    outputs:
      pr: ${{ steps.pr.outputs.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read settings
        id: config
        run: |
          echo "track=$(yq '.track // "RG"' config.yml)" >> "$GITHUB_OUTPUT"
          echo "ref=$(yq '.criteria_ref // "main"' config.yml)" >> "$GITHUB_OUTPUT"
          if [ -f criteria.yml ]; then
            echo "old_commit=$(yq '.source_commit' criteria.yml)" >> "$GITHUB_OUTPUT"
          fi

      - uses: lochhh/actions/greendisc_toolkit/sync_criteria@bcad8bbfb2f906ed28a66824c40409a6e8f1406f # greendisc-toolkit branch (untagged)
        with:
          track: ${{ steps.config.outputs.track }}
          ref: ${{ steps.config.outputs.ref }}

      - name: Open pull request if criteria changed, else close a stale one
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_COMMIT: ${{ steps.config.outputs.old_commit }}
        run: |
          branch=greendisc/sync-criteria
          git add criteria.yml
          if git diff --cached --quiet; then
            echo "criteria.yml is up to date"
            # Close a sync PR left over from an earlier run (e.g. criteria_ref was reverted).
            if [ "$(gh pr view "$branch" --json state -q .state 2>/dev/null)" = OPEN ]; then
              gh pr close "$branch" --delete-branch --comment "criteria.yml is already up to date; closing."
            fi
            exit 0
          fi
          source=$(yq '.source' criteria.yml)
          new_commit=$(yq '.source_commit' criteria.yml)
          body="Regenerated \`criteria.yml\` from upstream commit [${new_commit:0:7}](${source}/commit/${new_commit})."
          if [ -n "$OLD_COMMIT" ] && [ "$OLD_COMMIT" != "$new_commit" ]; then
            body+=$'\n\n'"Review the [upstream changes since ${OLD_COMMIT:0:7}](${source}/compare/${OLD_COMMIT}...${new_commit}), including wording not captured in \`criteria.yml\`."
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git commit -m "Sync Green DiSC criteria"
          git push --force origin "$branch"
          gh pr create --title "Sync Green DiSC criteria" --body "$body" --head "$branch" \
            || gh pr edit "$branch" --body "$body"
          echo "number=$(gh pr view "$branch" --json number -q .number)" >> "$GITHUB_OUTPUT"
