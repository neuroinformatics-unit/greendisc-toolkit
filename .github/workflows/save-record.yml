name: Save Green DiSC records

# Welcomes new record issues, flags edits not yet saved, and saves records to
# data/*.csv when someone comments /save.
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  record:
    # Issues only (not pull requests), and only people with write access.
    if: >-
      !github.event.issue.pull_request &&
      (github.event_name == 'issues' || startsWith(github.event.comment.body, '/save')) &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
        github.event_name == 'issues' && github.event.issue.author_association || github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the CSV files
      issues: write # label and comment on record issues, close duplicates
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: lochhh/actions/greendisc_toolkit/save_record@bed7b7c9e082bbedffd7d38933ed4660586df6ba # greendisc-toolkit branch (untagged)
