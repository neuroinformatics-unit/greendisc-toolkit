name: Save Green DiSC records

# Welcomes new record issues, flags edits not yet saved, and saves records to
# data/*.csv when someone comments /save.
on:
  issues:
    types: [edited]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  record:
    # Issues only (not pull requests). Edits only flag unsaved changes; for
    # /save, this is a first filter and the action checks the commenter's role.
    if: >-
      !github.event.issue.pull_request &&
      (github.event_name == 'issues' ||
        (startsWith(github.event.comment.body, '/save') &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)))
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the CSV files
      issues: write # label records, reply to /save, tick and close check-ins
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: lochhh/actions/greendisc_toolkit/save_record@f7068bb5109fbf5ee41f622f0c39d7b3645ae70c # greendisc-toolkit branch (untagged)
