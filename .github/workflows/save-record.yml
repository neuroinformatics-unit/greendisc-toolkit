name: Save Green DiSC records

# Flags edits not yet saved, saves records to data/*.csv when someone comments
# /save, and removes a record's rows when it is closed (its owner left).
on:
  issues:
    types: [edited, closed]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  record:
    # Issues only (not pull requests). Edits only flag unsaved changes, and
    # closing a record removes its rows; for /save, this is a first filter and
    # the action checks the commenter's role.
    # Not in the template repository itself.
    if: >-
      !github.event.repository.is_template &&
      !github.event.issue.pull_request &&
      (github.event_name == 'issues' ||
        (startsWith(github.event.comment.body, '/save') &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)))
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the CSV files
      issues: write # label records, reply to /save, tick and close check-ins
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: lochhh/actions/greendisc_toolkit/save_record@b72fb6df65abd23a88b3cbf0fbb8ae0ae16cb355 # greendisc-toolkit branch (untagged)
