name: My Green DiSC record
description: The equipment you use, for the group's Green DiSC evidence. One record per person; edit it to keep it up to date.
title: "Green DiSC record: "
body:
  - type: markdown
    attributes:
      value: |
        List what **you** use or look after. Leave a cell blank if you don't know; it's saved as `unknown` so it can be filled in later.

        When you're done, click **Create**, then comment `/save` on the new issue to save your record. Keep the issue open: to update it later (a new monitor, a laptop retired), edit it and comment `/save` again. If you already have a record, edit that one instead of creating another.
  - type: textarea
    id: hardware
    attributes:
      label: Hardware
      description: One row per item. Copy a row to add more, and keep the header row as it is. Guidance is in the comment above the table, which stays visible whenever you edit the issue.
      value: |
        <!--
        Type: what it is, e.g. laptop, desktop, monitor, tablet, external drive, docking station
        Purchased: year, e.g. 2023
        Status: in use, unused or disposed
        Action: for unused or disposed items, what was or will be done (repurpose, donate, recycle, ...)
        Location, Asset tag: optional. Leave blank if this repository is or could become public.
        -->
        | Type | Model | Supplier | Purchased | Warranty | Status | Action | Location | Asset tag |
        |------|-------|----------|-----------|----------|--------|--------|----------|-----------|
        |      |       |          |           |          |        |        |          |           |
