name: Green DiSC personal record
description: The equipment, data and pipelines you use, for the group's Green DiSC evidence. One record per person; edit it to keep it up to date.
title: "Green DiSC personal record: "
labels: ["personal-record"]
body:
  - type: markdown
    attributes:
      value: |
        Each review creates a personal record for every member who doesn't have one yet, so you normally don't need this form. Use it only to start your record before the next review: add your name to the title, fill in the tables, click **Create**, then comment `/save` on the new issue. If you already have a record, edit that one instead.
  - type: textarea
    id: how-to
    attributes:
      label: How to update this record
      description: Shown at the top of the issue, so it's there whenever the record is edited. You can leave it as it is.
      value: |
        - List what you use, plus any shared group items you look after (e.g. a shared server, meeting-room screen, group dataset or pipeline). Each shared item goes in one person's record only. One row per item.
        - Leave a cell blank if you don't know, and write `n/a` if it doesn't apply. Leave a whole table empty if it doesn't apply to you.
        - Don't delete rows for things you no longer use: change their status instead.
        - When your record is complete and up to date, click **Save** on the issue, then comment `/save`. The bot validates every row and copies the tables into the group's data files (`data/*.csv`), which the Green DiSC evidence and summary are built from.
        - Do not close this issue: it's your record for as long as you're in the group, updated before each review.
  - type: textarea
    id: hardware
    attributes:
      label: Hardware
      description: One row per item. Column hints are in the comment above the table, which stays visible whenever you edit the issue.
      value: |
        Evidence for `RG-01-B` Computing hardware inventory and `RG-02-B` Unused computing equipment inventory (items with status `unused`).
        <!--
        Type: what it is, e.g. laptop, desktop, monitor, tablet, external drive, docking station
        Purchased: year, e.g. 2023
        Status: in use, unused or disposed
        Action: for unused or disposed items, what was or will be done (repurpose, donate, recycle, ...). guides/e-waste.md in this repository lists where equipment can go.
        Location, Asset tag: optional. Leave blank if this repository is or could become public.
        Notes: optional, anything that helps (e.g. shared with a colleague, waiting for IT)
        -->
        | Type | Model | Supplier | Purchased | Warranty | Status | Action | Location | Asset tag | Notes |
        |------|-------|----------|-----------|----------|--------|--------|----------|-----------|-------|
        |      |       |          |           |          |        |        |          |           |       |
  - type: textarea
    id: data-resources
    attributes:
      label: Data resources
      description: The main datasets you use or look after, including ones hosted elsewhere. One row per dataset.
      value: |
        Evidence for `RG-DS1-B` Data resource inventory.
        <!--
        Name: what the dataset is called
        Hosted by: us (we store it) or external (someone else hosts it; the other columns can stay brief)
        Location: where it's stored, e.g. cluster, cloud bucket, lab server. Leave blank if this repository is or could become public.
        Size: e.g. 500 GB, ~3 TB
        If lost: easy to replace, hard to replace or irreplaceable
        Status: in use, archived or deleted
        Notes: optional, anything that helps (e.g. shared with a colleague, waiting for IT)
        -->
        | Name | Hosted by | Location | Size | If lost | Status | Notes |
        |------|-----------|----------|------|---------|--------|-------|
        |      |           |          |      |         |        |       |
  - type: textarea
    id: data-cleaning
    attributes:
      label: Data cleaning
      description: Each time you clean up your data directories, or shared storage you look after. Add a row per cleanup, keeping earlier rows.
      value: |
        Evidence for `RG-DS2-B` Data directory cleaning.
        <!--
        Date: when you cleaned up, as YYYY-MM-DD, e.g. 2026-10-13
        Scope: what you went through, e.g. my scratch space on the cluster
        Freed: storage freed, e.g. 40 GB, ~1 TB
        Next: when you plan the next cleanup, as YYYY-MM-DD
        Notes: optional, anything that helps (e.g. shared with a colleague, waiting for IT)
        -->
        | Date | Scope | Freed | Next | Notes |
        |------|-------|-------|------|-------|
        |      |       |       |      |       |
  - type: textarea
    id: pipelines
    attributes:
      label: Pipelines
      description: The computing pipelines you run. One row per pipeline.
      value: |
        Evidence for `RG-HPC2-B` Computing pipeline inventory.
        <!--
        Name: what the pipeline is called or does
        Runs on: e.g. the cluster's name, cloud, laptop
        Runtime: per run, e.g. 3 h, 2 days
        Resources: per run, e.g. 4 GPUs, 64 GB RAM
        Frequency: how often it runs, e.g. weekly, ~200 a year
        Status: active or retired
        Notes: optional, anything that helps (e.g. shared with a colleague, waiting for IT)
        -->
        | Name | Runs on | Runtime | Resources | Frequency | Status | Notes |
        |------|---------|---------|-----------|-----------|--------|-------|
        |      |         |         |           |           |        |       |
