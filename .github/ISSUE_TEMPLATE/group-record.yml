name: Green DiSC group record
description: Computing systems, training and sharing, for the group's Green DiSC evidence. One per repository; anyone in the group can add to it, and the Green DiSC representative saves it.
title: "Green DiSC group record"
labels: ["group-record"]
body:
  - type: markdown
    attributes:
      value: |
        Created once, by the Green DiSC representative: fill in the tables below, click **Create**, then comment `/save` on the new issue to save it to the group's data. If a group record already exists, edit that one instead.
  - type: textarea
    id: how-to
    attributes:
      label: How to update this record
      description: Shown at the top of the issue, so it's there whenever the record is edited. You can leave it as it is.
      value: |
        - Anyone in the group can add to this record: add a row per system, session or activity.
        - Keep earlier rows: together they are the history Green DiSC asks for.
        - Leave a cell blank if you don't know, and write `n/a` if it doesn't apply.
        - When you've added your rows, click **Save** on the issue. It's then marked `unsaved changes` for the Green DiSC representative to review.
        - Do not close this issue: it's the group's ongoing record, updated before each review.

        **For the Green DiSC representative:** review members' changes, then comment `/save`. The bot validates every row and copies the tables into the group's data files (`data/*.csv`), which the Green DiSC evidence and summary are built from.
  - type: textarea
    id: compute
    attributes:
      label: Compute infrastructure
      description: The computing systems the group uses or could use, on-site and off-site. One row per system.
      value: |
        Evidence for `RG-HPC1-B` Computing infrastructure inventory.
        <!--
        System: e.g. institution HPC cluster, cloud provider, lab GPU server
        Site: on-site or off-site
        Provider: who runs it, e.g. the institution, a cloud company, our group
        Region: where the data centre is (city or region); matters for how clean the electricity is
        PUE: power usage effectiveness of the data centre, e.g. ~1.3 (lower is better); ask the computing team or provider
        Electricity: e.g. grid, renewable tariff, on-site solar
        Hardware: e.g. CPU and GPU nodes, 2 GPUs
        Reason: for servers the group runs itself, why (e.g. special hardware, data that can't leave the building)
        Status: in use or retired
        Notes: optional, anything that helps
        How to use these systems well: guides/green-computing.md in this repository.
        -->
        | System | Site | Provider | Region | PUE | Electricity | Hardware | Reason | Status | Notes |
        |--------|------|----------|--------|-----|-------------|----------|--------|--------|-------|
        |        |      |          |        |     |             |          |        |        |       |
  - type: textarea
    id: training
    attributes:
      label: Training
      description: Green computing training sessions and resources. One row per session or resource; keep earlier rows.
      value: |
        Evidence for `RG-HPC3-B` Green computing best practices.
        <!--
        Date: when it ran or was published, as YYYY-MM-DD, e.g. 2026-10-13
        Title: what it was called
        Format: e.g. talk, workshop, guide, induction
        Attendees: how many people, e.g. 12, ~40
        Materials: link to slides, recording or guide
        Notes: optional, anything that helps
        -->
        | Date | Title | Format | Attendees | Materials | Notes |
        |------|-------|--------|-----------|-----------|-------|
        |      |       |        |           |           |       |
  - type: textarea
    id: sharing
    attributes:
      label: Sharing and promotion
      description: Resources shared with other groups, and activities promoting Green DiSC. One row per activity; keep earlier rows.
      value: |
        Evidence for `RG-G3-B` Resources are shared with other groups (kind `shared resource`) and `RG-G4-B` Green DiSC dissemination (kind `promotion`).
        <!--
        Date: when, as YYYY-MM-DD
        Kind: shared resource (material shared with other groups) or promotion (encouraging other groups to take part)
        What: what was shared or done, e.g. induction slides, talk at department meeting
        How: e.g. Green DiSC forum, mailing list, central team
        People reached: roughly how many, e.g. 30, ~200
        Link: where it can be found
        Notes: optional, anything that helps
        -->
        | Date | Kind | What | How | People reached | Link | Notes |
        |------|------|------|-----|----------------|------|-------|
        |      |      |      |     |                |      |       |
